<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Reportes AV{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="barra-superior">
  <div class="contenedor barra-interna">
    <a class="marca" href="{{ url_for('index') }}">Reportes <span>AV</span></a>
    <nav>
      <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} class="activo"{% endif %}>Consultar</a>
      <a href="{{ url_for('nuevo') }}"{% if request.endpoint in ['nuevo', 'editar'] %} class="activo"{% endif %}>Nuevo reporte</a>
    </nav>
  </div>
</header>
<main class="contenedor">
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for cat, m in mensajes %}<div class="aviso {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
